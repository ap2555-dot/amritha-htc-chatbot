<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="description" content="Orbit is a friendly general-purpose AI chatbot.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/robot.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('orbit-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#composer-input">Skip to message box</a>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">ORBIT</span>
        <span class="label brand-tag">general-purpose AI</span>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="new-chat" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
          New chat
        </button>
        <button class="btn btn-icon" id="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="scene" aria-label="Orbit the robot">
        <div class="scene-glow" aria-hidden="true"></div>
        <img class="robot" src="assets/robot.png" alt="Orbit, a friendly pixel-art robot waving hello" width="840" height="840">
        <div class="bubble" role="note">
          <span class="label bubble-label">orbit says</span>
          <p>Hey, I’m Orbit. What’s on your mind?</p>
        </div>
      </section>

      <section class="chat" aria-label="Chat with Orbit">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Conversation">
          <div class="empty" id="empty">
            <span class="label">try asking</span>
            <div class="chips" id="chips" role="group" aria-label="Suggested questions">
              <button type="button" class="chip chip-lime">Explain black holes like I’m 12</button>
              <button type="button" class="chip chip-blue">Brainstorm 10 names for a coffee shop</button>
              <button type="button" class="chip chip-coral">Write a friendly email asking for a deadline extension</button>
              <button type="button" class="chip chip-lime">What’s the difference between stocks and bonds?</button>
            </div>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="composer-input">Message Orbit</label>
          <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Message Orbit…" enterkeyhint="send"></textarea>
          <div class="composer-row">
            <span class="label hint" id="hint">Enter to send · Shift+Enter for new line</span>
            <span class="label count" id="count" aria-live="off">0/2000</span>
            <button class="btn btn-send" id="send" type="submit" disabled>
              Send
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
